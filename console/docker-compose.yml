services:
  ksk-console:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    # host networking: server.ts binds 127.0.0.1 by default (no auth layer —
    # see README "Security & cost notes"). With bridge networking that bind
    # would be unreachable from the host despite a `ports:` mapping; host
    # networking keeps that default true without touching server.ts, while
    # still letting KSK_CONSOLE_HOST below opt into a specific interface
    # (e.g. a Tailscale IP) when that's genuinely wanted.
    # Linux only — swap to `ports: ["127.0.0.1:4820:4820"]` + bind 0.0.0.0 in
    # server.ts if this ever needs to run under Docker Desktop.
    network_mode: host
    environment:
      KSK_ENGINE: "${KSK_ENGINE:-mock}"
      KSK_CONSOLE_HOST: "${KSK_CONSOLE_HOST:-127.0.0.1}"
      KSK_CONSOLE_PORT: "${KSK_CONSOLE_PORT:-4820}"
      KSK_WORKSPACE_ROOT: /workspace
      KSK_PERMISSION_MODE: "${KSK_PERMISSION_MODE:-acceptEdits}"
      KSK_ENGINE_MODEL: "${KSK_ENGINE_MODEL:-}"
      KSK_MAX_BUDGET_USD: "${KSK_MAX_BUDGET_USD:-}"
      KSK_RUN_BUDGET_USD: "${KSK_RUN_BUDGET_USD:-25}"
      KSK_AUTO_CONTINUE: "${KSK_AUTO_CONTINUE:-1}"
      KSK_AUTO_CONTINUE_MAX: "${KSK_AUTO_CONTINUE_MAX:-8}"
    volumes:
      # Real client data — set KSK_WORKSPACE_ROOT_HOST in .env. Left
      # unmounted in mock mode; only required when KSK_ENGINE=claude.
      - "${KSK_WORKSPACE_ROOT_HOST:-./demo-workspace}:/workspace"
      # The /ksk-keying skill + its subagents (watson, marple, sherlock,
      # poirot, lestrade, columbo, magnum, ...) live in the host repo's own
      # .claude/, not inside the client workspace. On bare-host runs,
      # KSK_WORKSPACE_ROOT sits a few directories *below* that repo root, so
      # Claude Code finds .claude/ by walking up from cwd. Inside the
      # container /workspace has nothing above it, so without this mount
      # every real run instantly no-ops with "Unknown command: /ksk-keying"
      # and gets misreported as a clean done (0 events of real work, $0
      # cost) — set KSK_SKILLS_HOST in .env to the repo root's .claude/ dir.
      # Only meaningful when KSK_ENGINE=claude; harmless if left unset.
      - "${KSK_SKILLS_HOST:-./.empty-skills}:/workspace/.claude:ro"
      # Run history/logs — same gitignored dir the non-Docker README already
      # treats as durable; without this it resets on every container rebuild.
      - ./runs:/app/runs
      # Claude CLI auth — the whole point of this file. Read-write, not
      # read-only: the CLI refreshes accessToken against refreshToken and
      # writes the new pair back here, so mounting rw keeps host and
      # container logged in as the same session instead of drifting apart.
      # HOST_HOME (not $HOME) deliberately: if this is ever brought up via
      # `sudo docker compose ...`, ambient $HOME resolves to /root, silently
      # mounting the wrong (nonexistent) credential path. Set HOST_HOME
      # explicitly in .env instead of relying on shell environment.
      - ${HOST_HOME}/.claude/.credentials.json:/home/app/.claude/.credentials.json
      # Avoids first-run onboarding prompts (theme pick, telemetry consent,
      # account recognition) that would otherwise hang a headless `claude -p`
      # spawn. That is this file's ONLY job here — auth and token refresh live
      # in .credentials.json above, which is why this one does not need to be
      # the host's real file. See ./state/claude.json's rationale on ksk-app
      # below; both services share the same container-owned copy.
      - ./state/claude.json:/home/app/.claude.json

  # The new review app (wayfinder ticket #38+, app/server.ts) — separate
  # service, separate port, same image. Runs `bun run app/server.ts` instead
  # of the image's default CMD via `command:` below; no KSK_ENGINE mock
  # toggle exists for this app (it always shells out to a real `claude -p`
  # per stage, see sequencer/spawn-stage.ts), so this service has a smaller
  # env surface than ksk-console above. Run state lives inside each
  # client-month's own ข้อมูลระบบ/_pages/run-state.yaml under the workspace
  # mount itself — no separate runs/ volume needed, unlike ksk-console.
  ksk-app:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    network_mode: host
    # tini reaps anything that becomes orphaned during catastrophic failure;
    # normal cancellation is handled earlier by process-supervisor.ts.
    init: true
    # Give SIGTERM handling enough time to TERM -> grace -> KILL all active
    # stage and gate process groups before Docker forcibly tears down cgroup.
    stop_grace_period: 20s
    # Failsafes, not lifecycle control: one bad agent command cannot consume
    # unlimited host processes or more than a bounded CPU share.
    pids_limit: 512
    cpus: "${KSK_APP_CPUS:-2.0}"
    # The host this runs on is a 4-core Pi whose swap is already fully consumed
    # at idle, and the container has been OOM-killed (exit 137) in practice. An
    # unbounded container turns a runaway agent into a *host*-level OOM, which
    # takes the tunnel sidecar and everything else down with it; bounded, the
    # kernel kills only this container and the restart policy brings it back.
    mem_limit: "${KSK_APP_MEM:-3g}"
    mem_reservation: "${KSK_APP_MEM_RESERVATION:-1g}"
    command: ["bun", "run", "app/server.ts"]
    environment:
      KSK_APP_PORT: "${KSK_APP_PORT:-8940}"
      KSK_APP_HOST: "${KSK_APP_HOST:-0.0.0.0}"
      KSK_APP_CONCURRENCY: "${KSK_APP_CONCURRENCY:-1}"
      KSK_WORKSPACE_ROOT: /workspace
    volumes:
      # Same rationale as ksk-console's KSK_WORKSPACE_ROOT_HOST/KSK_SKILLS_HOST
      # above, just this app's own env var names so both services can point
      # at different workspaces/skill sets from the same .env.
      - "${KSK_APP_WORKSPACE_ROOT_HOST:-./demo-workspace}:/workspace"
      - "${KSK_APP_SKILLS_HOST:-./.empty-skills}:/workspace/.claude:ro"
      - ${HOST_HOME}/.claude/.credentials.json:/home/app/.claude/.credentials.json
      # Deliberately NOT ${HOST_HOME}/.claude.json. Measured 2026-07-27: this
      # bind is read-write and the container's own `claude -p` writes to it, so
      # up to KSK_INTERPRET_CONCURRENCY leaves plus the host's interactive
      # session were rewriting one unlocked ~62 KB JSON with no coordination —
      # a torn write there breaks Claude Code startup on the HOST, taking down
      # far more than this container. (It had drifted onto a separate inode by
      # the time it was caught, which was luck, not design: every `compose up`
      # re-binds them.) The container needs this file only to skip onboarding
      # prompts, never to share state, so it gets its own gitignored copy —
      # seeded from the host file with `projects` and the refetchable caches
      # stripped, 2 KB instead of 62 KB. Real auth is .credentials.json above,
      # which genuinely must stay shared read-write for token refresh.
      - ./state/claude.json:/home/app/.claude.json

  # Exposes ksk-app at ksk-keying.peerasak.com via Cloudflare Tunnel, gated by
  # a Cloudflare Access policy (email allowlist) — see README for setup.
  # network_mode: host so it can reach ksk-app at localhost:8940 the same way
  # ksk-app itself binds there; credentials/config live in the host's
  # ~/.cloudflared (outside the repo, never committed).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    # Tunnel credentials file on the host is owned by uid 1000 (peerasak)
    # with 0400 perms; the image's default non-root user has a different
    # uid, so it can't read the mount without this.
    user: "${UID:-1000}:${GID:-1000}"
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ${HOST_HOME}/.cloudflared/ksk-keying.yml:/etc/cloudflared/config.yml:ro
      - ${HOST_HOME}/.cloudflared/a28fb812-44cd-409e-a9c4-d83da9968079.json:/home/peerasak/.cloudflared/a28fb812-44cd-409e-a9c4-d83da9968079.json:ro
