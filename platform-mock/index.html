<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KSK Platform — mock (ตัวอย่างหน้าจอ ไม่ใช่ระบบจริง)</title>
<style>
/* ------------------------------------------------------------------
   KSK Platform — visual mock.
   Palette and shapes are lifted from the existing Console
   (console/app/*.ts inline styles): warm stone background, near-black
   header, 10-12px rounded white cards, pill chips, blue #1d4ed8 accent.
   ------------------------------------------------------------------ */
:root{
  --bg:#f7f6f3; --panel:#fff; --panel2:#f1efec; --line:#e4e0d8; --line2:#ddd9d0;
  --ink:#292524; --ink2:#57534e; --muted:#78716c; --faint:#a8a29e;
  --dark:#1c1917; --dark2:#292524;
  --accent:#1d4ed8; --accent-bg:#e8eefc;
  --ok:#15803d; --ok-bg:#dcfce7; --ok-ink:#166534;
  --warn:#b45309; --warn-bg:#fef3c7; --warn-ink:#92400e;
  --bad:#b91c1c; --bad-bg:#fee2e2; --bad-ink:#991b1b;
  --bot:#6d28d9; --bot-bg:#ede9fe; --bot-ink:#5b21b6;
  --shadow:0 1px 3px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--bg);color-scheme:light}
body{
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Sarabun","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif;
  background:var(--bg); color:var(--ink);
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit}
h1,h2,h3,h4{margin:0;font-weight:700}
table{border-collapse:collapse;width:100%}

/* ---------- mock banner ---------- */
.mockbar{
  background:repeating-linear-gradient(135deg,#1c1917,#1c1917 12px,#292524 12px,#292524 24px);
  color:#fbbf24;font-size:11px;font-weight:700;letter-spacing:.04em;
  padding:4px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;
}
.mockbar span.right{color:#a8a29e;font-weight:600}

/* ---------- top bar ---------- */
.topbar{
  background:var(--dark);color:#fafaf9;display:flex;align-items:center;gap:14px;
  padding:0 16px;height:50px;position:sticky;top:0;z-index:40;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.01em}
.brand .logo{
  width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#1d4ed8,#0ea5e9);
  display:grid;place-items:center;font-size:11px;color:#fff;font-weight:800;
}
.brand small{display:block;font-size:10px;color:var(--faint);font-weight:600;letter-spacing:.06em}
.topbar .crumbs{display:flex;gap:6px;align-items:center;font-size:12px;color:#a8a29e;flex:1;min-width:0}
.topbar .crumbs a{color:#a8a29e}
.topbar .crumbs .here{color:#d6d3cd}
.topbar .sep{color:#57534e}
.topbar-right{display:flex;align-items:center;gap:8px}
.iconbtn{
  background:#292524;border:1px solid #44403c;color:#e7e5e4;border-radius:8px;
  padding:5px 9px;cursor:pointer;font-size:12px;position:relative;
}
.iconbtn:hover{background:#44403c}
.dot{position:absolute;top:2px;right:3px;width:7px;height:7px;border-radius:99px;background:#f59e0b}
.usrchip{
  display:flex;align-items:center;gap:8px;background:#292524;border:1px solid #44403c;
  border-radius:999px;padding:3px 10px 3px 4px;cursor:pointer;
}
.usrchip:hover{background:#44403c}
.avatar{width:24px;height:24px;border-radius:999px;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700}
.usrchip .nm{font-size:12.5px;font-weight:600;color:#fafaf9;line-height:1.1}
.usrchip .rl{font-size:10px;color:#a8a29e;line-height:1.1}

/* ---------- layout ---------- */
.shell{display:flex;min-height:calc(100vh - 74px)}
.side{
  width:240px;flex:none;background:var(--panel2);border-right:1px solid var(--line);
  padding:12px 10px 24px;display:flex;flex-direction:column;gap:14px;
}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup h5{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:6px 8px 3px;font-weight:800}
.navlink{
  display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;color:var(--ink2);
  font-size:13.5px;font-weight:600;cursor:pointer;
}
.navlink:hover{background:#e7e3dc;text-decoration:none;color:var(--ink)}
.navlink.on{background:#fff;color:var(--accent);box-shadow:var(--shadow)}
.navlink .ic{width:18px;text-align:center;font-size:13px}
.navlink .ph{margin-left:auto}
.navlink.locked{opacity:.42;cursor:not-allowed}
.main{flex:1;min-width:0;padding:18px 22px 60px}

/* ---------- phase badges ---------- */
.ph{
  font-size:9.5px;font-weight:800;letter-spacing:.03em;border-radius:5px;padding:2px 5px;
  border:1px solid transparent;white-space:nowrap;
}
.ph0{background:#e7e5e4;color:#57534e;border-color:#d6d3d1}
.ph1{background:#dbeafe;color:#1e40af;border-color:#bfdbfe}
.ph2{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.ph3{background:#fef3c7;color:#92400e;border-color:#fde68a}
.ph4{background:#ede9fe;color:#5b21b6;border-color:#ddd6fe}
.ph5{background:#ffe4e6;color:#9f1239;border-color:#fecdd3}
.ph6{background:#f5f5f4;color:#78716c;border-color:#e7e5e4;border-style:dashed}

/* ---------- generic bits ---------- */
.pagehead{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.pagehead h1{font-size:21px;letter-spacing:-.01em}
.pagehead .sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.spacer{flex:1}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card.pad{padding:14px 16px}
.card h3{font-size:14px;margin-bottom:2px}
.card .hint{font-size:11.5px;color:var(--muted)}
.cardhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.cardbody{padding:14px 16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}

.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800}
.kpi .val{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.kpi .sub{font-size:11.5px;color:var(--muted)}

.btn{
  border:1px solid var(--line2);background:#fff;color:var(--ink2);border-radius:8px;
  padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;
}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#1a43bd}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ok:hover{background:#136c34}
.btn.danger{background:#fff;border-color:#fca5a5;color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.small{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed;filter:grayscale(.85)}
.btn.bot{background:var(--bot);border-color:var(--bot);color:#fff}

.chip{
  display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);background:#fff;
  border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;
}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 9px}
.t-ok{background:var(--ok-bg);color:var(--ok-ink)}
.t-warn{background:var(--warn-bg);color:var(--warn-ink)}
.t-bad{background:var(--bad-bg);color:var(--bad-ink)}
.t-info{background:var(--accent-bg);color:#1e40af}
.t-grey{background:#f0efec;color:var(--ink2)}
.t-bot{background:var(--bot-bg);color:var(--bot-ink)}
.t-purple{background:#ede9fe;color:#5b21b6}

table.data{font-size:13px}
table.data th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);
  background:var(--panel2);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:800;white-space:nowrap;
}
table.data td{padding:9px 10px;border-bottom:1px solid #f0eee9;vertical-align:middle}
table.data tbody tr:hover{background:#faf9f7}
table.data tr.clickable{cursor:pointer}
.tblwrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}

.pill-person{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.pill-person .avatar{width:20px;height:20px;font-size:10px}

.bar{height:6px;border-radius:99px;background:#eceae5;overflow:hidden;min-width:70px}
.bar > i{display:block;height:100%;background:var(--accent)}
.bar.ok > i{background:var(--ok)}
.bar.warn > i{background:#f59e0b}

/* gate rail */
.rail{display:flex;gap:8px;overflow-x:auto;padding:2px}
.gatecard{
  flex:1;min-width:150px;border:1px solid var(--line);border-radius:11px;background:#fff;
  padding:10px 11px;cursor:pointer;position:relative;box-shadow:var(--shadow);
}
.gatecard:hover{border-color:#c9c3b7}
.gatecard.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg)}
.gatecard .gnum{font-size:10.5px;font-weight:800;color:var(--faint);letter-spacing:.05em}
.gatecard .gname{font-size:13px;font-weight:700;margin:1px 0 6px}
.gatecard .gmeta{font-size:11px;color:var(--muted)}
.gatecard.s-passed{background:#f4fdf6;border-color:#bbf7d0}
.gatecard.s-failed{background:#fff5f5;border-color:#fecaca}
.gatecard.s-in_progress{background:#fbfaff;border-color:#c7d2fe}
.gatecard.s-stale{background:#fffbeb;border-color:#fde68a}
.gatecard.s-skipped{opacity:.72}

.reqrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid #f0eee9}
.reqrow:last-child{border-bottom:0}
.reqbox{
  width:19px;height:19px;flex:none;border-radius:6px;border:2px solid #cfcabf;background:#fff;
  display:grid;place-items:center;cursor:pointer;font-size:12px;color:#fff;margin-top:1px;
}
.reqbox.done{background:var(--ok);border-color:var(--ok)}
.reqbox.auto{background:var(--bot);border-color:var(--bot)}
.reqbox.waived{background:#a8a29e;border-color:#a8a29e}
.reqbox.na{background:#e7e5e4;border-color:#d6d3d1;color:#78716c}
.reqbox.locked{cursor:not-allowed;opacity:.6}
.reqmain{flex:1;min-width:0}
.reqname{font-size:13.5px;font-weight:600}
.reqmeta{font-size:11.5px;color:var(--muted);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.cond{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;padding:5px 0}
.cond .mark{width:17px;height:17px;flex:none;border-radius:99px;display:grid;place-items:center;font-size:10px;color:#fff;margin-top:2px}
.cond.yes .mark{background:var(--ok)}
.cond.no .mark{background:#d6d3d1;color:#57534e}
.cond.no{color:var(--muted)}

.tl{position:relative;padding-left:20px}
.tl:before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line)}
.tlitem{position:relative;padding:7px 0}
.tlitem:before{content:"";position:absolute;left:-17px;top:13px;width:9px;height:9px;border-radius:99px;background:#c9c3b7;border:2px solid #fff}
.tlitem.api:before{background:var(--bot)}
.tlitem.sys:before{background:#0ea5e9}
.tlitem .when{font-size:11px;color:var(--faint)}
.tlitem .what{font-size:13px}

.actor{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:12.5px}
.actor.api{color:var(--bot-ink);background:var(--bot-bg);border:1px dashed #c4b5fd;border-radius:6px;padding:0 6px}
.actor.sys{color:#075985;background:#e0f2fe;border:1px solid #bae6fd;border-radius:6px;padding:0 6px}

/* modal / drawer */
.scrim{position:fixed;inset:0;background:rgba(28,25,23,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.modal.wide{max-width:900px}
.modalhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;border-radius:14px 14px 0 0}
.modalbody{padding:16px 18px}
.modalfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
.x{margin-left:auto;background:none;border:0;font-size:18px;color:var(--muted);cursor:pointer;line-height:1}

input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{
  border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;background:#fff;color:var(--ink);width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-bg);border-color:var(--accent)}
label.fl{display:block;font-size:11.5px;font-weight:700;color:var(--ink2);margin-bottom:3px}
.field{margin-bottom:11px}
.readonly{background:var(--panel2);color:var(--ink2)}

.callout{border-left:3px solid var(--accent);background:var(--accent-bg);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.5px}
.callout.warn{border-color:#f59e0b;background:var(--warn-bg);color:var(--warn-ink)}
.callout.bot{border-color:var(--bot);background:var(--bot-bg);color:var(--bot-ink)}
.callout.grey{border-color:#a8a29e;background:var(--panel2);color:var(--ink2)}

pre.code{background:#1c1917;color:#e7e5e4;border-radius:10px;padding:12px 14px;font-size:11.5px;overflow:auto;line-height:1.5}
pre.code .k{color:#7dd3fc}
pre.code .s{color:#bef264}

.toast{
  position:fixed;right:18px;bottom:18px;z-index:80;background:var(--dark);color:#fafaf9;
  border-radius:10px;padding:10px 14px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:380px;
}
.toast .t2{font-size:11.5px;color:#a8a29e}

/* login */
.loginwrap{min-height:100vh;display:grid;place-items:center;background:
  radial-gradient(900px 500px at 20% -10%,#e8eefc,transparent),var(--bg);padding:24px}
.loginbox{width:100%;max-width:400px}
.loginbox .card{padding:22px}
.demolist{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.demorow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:#fff}
.demorow:hover{background:var(--panel2)}
.demorow .nm{font-size:12.5px;font-weight:700}
.demorow .em{font-size:11px;color:var(--muted)}

/* matrix */
.mx td.cell{text-align:center;font-size:14px;width:36px;cursor:pointer}
.mx td.cell.p{color:var(--ok)}
.mx td.cell.f{color:var(--bad)}
.mx td.cell.i{color:var(--accent)}
.mx td.cell.n{color:#d6d3d1}
.mx td.cell.s{color:#f59e0b}

.yeargrid td.m{text-align:center;font-size:12px;padding:6px 4px}
.heat{display:block;border-radius:6px;padding:6px 2px;font-weight:700}

.designer-gate{border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:10px}
.dg-head{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--panel2);border-radius:11px 11px 0 0;border-bottom:1px solid var(--line)}
.dg-body{padding:10px 12px}
.dg-req{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed #eeece7}
.dg-req:last-child{border-bottom:0}
.drag{cursor:grab;color:var(--faint);font-size:14px}
.legendbox{font-size:11.5px;color:var(--ink2);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.legendbox .lrow{display:flex;gap:7px;align-items:flex-start;margin-bottom:4px}
</style>

function teamLead(teamId,seat){
  const u = USERS.find(u=>u.team===teamId && u.seat===seat);
  return u ? u.id : null;
}
/* ผู้มีสิทธิ์เซ็นด่าน: แปลง role ของด่าน → คนจริงตาม seat ในทีม (§5.5) */
function resolveRole(role, e, job){
  if(role==="frontdesk") return "u-fai";
  if(role==="admin")     return "u-ton";
  if(role==="executive") return "u-mai";
  if(role==="lead")      return teamLead(e.team,"lead") || "u-mai";
  if(role==="deputy")    return teamLead(e.team,"deputy") || teamLead(e.team,"lead");
  if(role==="staff")     return job ? job.assignee : e.owner;
  return e.owner;
}

function audit(actorId, entity, entityId, verb, detail, at){
  const ev = {id:nid("ev"), at: at || nowStamp(), actor:actorId, entity, entityId, verb, detail};
  AUDIT.push(ev); return ev;
}
function nowStamp(){
  const d=new Date(); const p=n=>String(n).padStart(2,"0");
  return TODAY+" "+p(d.getHours())+":"+p(d.getMinutes());
}
function dueOf(period, day){
  if(!period) return null;
  const [y,m] = period.split("-").map(Number);
  const nm = m===12 ? {y:y+1,m:1} : {y, m:m+1};      // ด่านทั้งหมดครบกำหนดในเดือนถัดจากงวด
  return nm.y+"-"+String(nm.m).padStart(2,"0")+"-"+String(day).padStart(2,"0");
}
function addDays(dateStr, n){
  const d = new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+n);
  const p=x=>String(x).padStart(2,"0");
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());
}
/* เวลาที่ "เกิดขึ้นแล้ว" ต้องไม่หลุดไปอยู่อนาคต — ถ้ากำหนดของด่านยังไม่ถึง
   ให้ถอยมาอิงวันนี้แทน โดยรักษาลำดับก่อน–หลังของด่านไว้ */
function passStamp(period, g){
  const d = dueOf(period, Math.max(2, g.sla-1));
  const cap = addDays(TODAY, -(7-g.order));
  return ((d && d<=cap) ? d : cap)+" 14:20";
}
function reqStamp(period, g){
  const d = dueOf(period, Math.max(2, g.sla-3));
  const cap = addDays(TODAY, -1);
  return ((d && d<=cap) ? d : cap)+" 11:05";
}

function buildJob(seed, idx){
  const e = eng(seed.eng), c = cust(e.cust), t = tpl(e.tpl);
  const id = "j-"+e.id+"-"+(seed.period||"prj");
  const job = {
    id, eng:e.id, cust:c.id, team:e.team, period:seed.period,
    title: (e.title || SERVICE_LABEL[e.type]) + (seed.period? " · "+thPeriod(seed.period) : ""),
    assignee: seed.assignee, tplId:t.id, tplVersion:t.version,
    workspace: (c.dropbox && !seed.noFolder && seed.period) ? c.dropbox+"/"+beYY(seed.period) : null,
    intake: seed.intake, note: seed.note||"", gates:[], openedAt: (seed.period? seed.period+"-01 08:00" : "2026-05-04 09:00"),
  };
  t.gates.forEach(g=>{
    const owner = resolveRole(g.owner, e, job);
    const jg = {
      key:g.key, order:g.order, name:g.name, desc:g.desc, ownerRole:g.owner, signOffRole:g.signOff,
      owner, sla:g.sla, blocks:g.blocks, allowSkip:g.skip, autoPass:g.autoPass,
      due: dueOf(seed.period, g.sla), status:"pending", passedBy:null, passedAt:null,
      failedReason:null, reopened:0, overrideUser:null, overrideReason:null,
      reqs: g.reqs.map(r=>({
        key:r.key, name:r.name, kind:r.kind, req:r.req, cond:r.cond||null, auto:r.auto||null,
        status:"pending", by:null, at:null, note:"", waivedReason:null,
        assignee: r.assignee==="job_assignee" ? job.assignee : owner,
        evidence:[]
      }))
    };
    job.gates.push(jg);
  });

  const pass = seed.passed||[];
  pass.forEach(k=>{
    const g = job.gates.find(x=>x.key===k); if(!g) return;
    g.status="passed";
    g.passedBy = resolveRole(g.signOffRole, e, job);
    g.passedAt = passStamp(seed.period, g);
    g.reqs.forEach(r=>{
      if(r.req==="conditional"){ r.status="not_applicable"; return; }
      r.status = "satisfied"; r.by = r.auto ? "sys" : r.assignee; r.at = g.passedAt;
      if(r.kind==="file") r.evidence.push({kind:"file",path:evidencePath(job,g,r),by:r.by,at:r.at});
      if(r.kind==="attestation") r.evidence.push({kind:"attestation",text:"ยืนยันด้วยตนเอง",by:r.by,at:r.at});
    });
    audit(g.passedBy,"job_gate",job.id+"#"+g.key,"gate.passed","เซ็นผ่าน "+g.name, g.passedAt);
  });
  if(seed.cur){
    const g = job.gates.find(x=>x.key===seed.cur);
    if(g){
      g.status = "in_progress";
      (seed.done && seed.done[seed.cur] || []).forEach(rk=>{
        const r = g.reqs.find(x=>x.key===rk); if(!r) return;
        r.status="satisfied"; r.by = r.auto ? "sys" : r.assignee; r.at = reqStamp(seed.period, g);
        if(r.kind==="file") r.evidence.push({kind:"file",path:evidencePath(job,g,r),by:r.by,at:r.at});
        if(r.kind==="attestation") r.evidence.push({kind:"attestation",text:"ยืนยันด้วยตนเอง",by:r.by,at:r.at});
      });
    }
  }
  if(seed.failed){
    const g = job.gates.find(x=>x.key===seed.failed.gate);
    g.status="failed"; g.failedReason=seed.failed.reason; g.passedBy=null;
    g.failedBy = seed.failed.by; g.failedAt = seed.failed.at; g.sendBack = seed.failed.back;
    const back = job.gates.find(x=>x.key===seed.failed.back);
    if(back){ back.status="in_progress"; back.reopened=1;
      job.gates.filter(x=>x.order>back.order && x.status==="passed").forEach(x=>{ x.status="stale"; }); }
    audit(seed.failed.by,"job_gate",job.id+"#"+g.key,"gate.failed",seed.failed.reason, seed.failed.at);
  }
  (seed.exceptions||[]).forEach(x=>{
    const ex = {id:nid("ex"), job:job.id, gate:"intake", kind:x.kind, sev:x.sev, title:x.title, desc:x.desc,
      by:x.by, at:x.at, notified:x.notified, via:x.via, resolved:x.resolved||null, resolvedBy:x.resolvedBy||null, resolution:x.resolution||""};
    EXCEPTIONS.push(ex);
    audit(x.by,"exception",ex.id,"exception.opened",x.title,x.at);
    if(x.resolved) audit(x.resolvedBy,"exception",ex.id,"exception.resolved",x.resolution,x.resolved);
  });
  audit(SYSTEM_ACTOR.id,"job",job.id,"job.created",
    "สร้างงานประจำงวดจากแม่แบบ "+t.name+" v"+t.version, job.openedAt);
  JOBS.push(job);
  return job;
}

  not_started:{t:"ยังไม่เริ่ม",c:"t-grey"}, in_progress:{t:"กำลังทำ",c:"t-info"},
  waiting_docs:{t:"รอเอกสาร",c:"t-warn"}, problem:{t:"มีปัญหา",c:"t-bad"},

};
function openExceptions(job){ return EXCEPTIONS.filter(x=>x.job===job.id && !x.resolved); }
function jobStatus(job){
  if(job.cancelled) return "cancelled";
  if(job.gates.some(g=>g.status==="failed")) return "problem";
  const g1 = job.gates[0];
  if(g1 && g1.status!=="passed" && openExceptions(job).length) return "waiting_docs";
  if(job.gates.every(g=>g.status==="passed"||g.status==="skipped")) return "done";
  if(job.gates.every(g=>g.status==="pending")) return "not_started";
  return "in_progress";
}
function jobProgress(job){
  const done = job.gates.filter(g=>g.status==="passed"||g.status==="skipped").length;
  return Math.round(done/job.gates.length*100);
}
function currentGate(job){
  return job.gates.find(g=>g.status==="in_progress"||g.status==="failed")
      || job.gates.find(g=>g.status!=="passed"&&g.status!=="skipped") || null;
}

  "template.edit":   {executive:"all",admin:"all"},
  "user.manage":     {admin:"all"},
  "backup.run":      {admin:"all"},
  "api.manage":      {admin:"all"},
};
function scopeFor(cap){ const m=CAPS[cap]; return m ? m[S.me.role] : null; }
function inScope(scope, job){
  if(!scope) return false;
  if(scope==="all") return true;
  if(scope==="team") return job ? job.team===S.me.team : true;
  if(scope==="own")  return job ? job.assignee===S.me.id : true;
  if(scope==="phase1") return true;   // ตรวจระดับด่านอีกที
  if(scope==="contacts") return true;
  return false;
}
function can(cap, job){ return inScope(scopeFor(cap), job); }

/* กฎเซ็นผ่านด่าน — เช็คกับ sign_off_role ของด่านเอง ไม่ใช่ตารางตายตัว */
const ROLE_RANK = {intern:0,staff:1,frontdesk:1,deputy:2,lead:3,executive:4,admin:5};
function canSign(job, gate){
  const me = S.me;
  if(me.role==="intern")  return {ok:false,why:"นักศึกษาฝึกงานเซ็นผ่านด่านไม่ได้ (ทำงานและเริ่มรอบคีย์ได้)"};
  if(me.role==="viewer")  return {ok:false,why:"บทบาทผู้ดูอย่างเดียว"};
  if(gate.overrideUser===me.id) return {ok:true,why:"ได้รับมอบหมายให้เซ็นแทน"};
  if(me.role==="admin"||me.role==="executive") return {ok:true,why:"ผู้บริหาร/ผู้ดูแลระบบเซ็นได้ทุกด่าน"};
  if(me.role==="frontdesk") return gate.key==="intake"
      ? {ok:true,why:"ทีมรับเอกสารเซ็นด่านรวบรวมเอกสารได้ทุกลูกค้า"}
      : {ok:false,why:"ทีมรับเอกสารเซ็นได้เฉพาะด่าน 1"};
  if(job.team!==me.team) return {ok:false,why:"งานนี้ไม่ได้อยู่ในทีมของคุณ"};
  if(ROLE_RANK[me.role] >= ROLE_RANK[gate.signOffRole]) return {ok:true,why:"ตำแหน่งของคุณ ≥ ผู้เซ็นที่ด่านกำหนด"};
  return {ok:false,why:"ด่านนี้กำหนดให้ "+ROLE_LABEL[gate.signOffRole]+" เป็นผู้เซ็น"};
}
/* กฎสี่ข้อ (report.md §5.6) */
function gateConditions(job, gate){
  const idx = job.gates.indexOf(gate);
  const reqsOk = gate.reqs.filter(r=>r.req==="required")
      .every(r=>["satisfied","waived","not_applicable"].includes(r.status));
  const sign = canSign(job, gate);
  const earlier = job.gates.slice(0,idx).filter(g=>g.blocks);
  const earlierOk = earlier.every(g=>["passed","skipped"].includes(g.status));
  return [
    {ok:reqsOk, t:"รายการที่บังคับทุกข้อ ทำแล้ว / ยกเว้น / ไม่เกี่ยวข้อง",
     d: reqsOk? "" : "ยังเหลือ "+gate.reqs.filter(r=>r.req==="required"&&!["satisfied","waived","not_applicable"].includes(r.status)).length+" รายการ"},
    {ok:sign.ok, t:"ผู้กดมีสิทธิ์เซ็นตาม sign-off role ของด่าน ("+ROLE_LABEL[gate.signOffRole]+")", d:sign.why},
    {ok:earlierOk, t:"ด่านก่อนหน้าที่กั้นไว้ ผ่านหรือถูกข้ามหมดแล้ว",
     d: earlierOk? "" : "ด่าน "+earlier.filter(g=>!["passed","skipped"].includes(g.status)).map(g=>g.order).join(", ")+" ยังไม่ผ่าน"},
    {ok:!job.cancelled, t:"งานยังไม่ถูกยกเลิก", d:""},
  ];
}

  return pageHead("กระดานงานเดือน", "ทุกงานประจำงวดของ "+(per==="prj"?"งานโปรเจ็ค/ที่ปรึกษา":thPeriod(per))+" · "+scopeNote, 1,

function jobAudit(job){
  return AUDIT.filter(e=>String(e.entityId).startsWith(job.id) || (e.entity==="exception" && EXCEPTIONS.some(x=>x.id===e.entityId&&x.job===job.id))
      || (e.entity==="keying_run" && KEYING_RUNS.some(r=>r.id===e.entityId&&r.job===job.id)))
    .slice().sort((a,b)=> a.at<b.at?1:-1);
}
function reviewChain(job){
  const e = eng(job.eng), out=[{u:job.assignee,r:"ผู้ทำงาน"}];
  const dep = teamLead(e.team,"deputy"), lead = teamLead(e.team,"lead");
  if(dep && dep!==job.assignee) out.push({u:dep,r:"รองหัวหน้า"});
  if(lead && lead!==job.assignee) out.push({u:lead,r:"หัวหน้าทีม"});
  out.push({u:"u-mai",r:"ผู้บริหาร (เฉพาะประเด็นสำคัญ)"});
  return out;
}

  const sel = job.gates.find(g=>g.key===S.selGate) || currentGate(job) || job.gates[0];
  const exs = EXCEPTIONS.filter(x=>x.job===job.id);

   + jf("บริการ / งวด", h(e.title||SERVICE_LABEL[e.type])+" · "+h(job.period? thPeriod(job.period):"งานโปรเจ็ค"))

   + jf("ทีม", h(byId(TEAMS,job.team).name))
   + jf("แม่แบบที่ถูกถ่ายสำเนาไว้", '<a href="#/templates/'+t.id+'">'+h(t.name)+" v"+job.tplVersion+"</a> <span class='tiny muted'>แก้แม่แบบทีหลังไม่กระทบงานนี้</span>")
   + jf("โฟลเดอร์เอกสาร (Dropbox)", job.workspace? '<span class="mono">'+h(job.workspace)+"</span>" : '<span class="tag t-warn">ยังไม่ผูกโฟลเดอร์</span> <span class="tiny muted">งานยังเดินได้ แต่เริ่มรอบคีย์ไม่ได้</span>')
   + jf("สถานะรับเอกสาร (ด่าน 1)", job.intake? '<span class="tag t-info">'+h(job.intake)+"</span>" : '<span class="muted">ไม่ใช้กับบริการนี้</span>')

   + "</div>";

  const rail = '<div class="rail" style="margin-bottom:12px">'+job.gates.map(g=>{
    const late = g.due && g.due<TODAY && !["passed","skipped"].includes(g.status);
    return '<div class="gatecard s-'+g.status+(g.key===sel.key?" sel":"")+'" onclick="A.selGate(\''+g.key+'\')">'
     + '<div class="gnum">ด่าน '+g.order+"</div><div class=\"gname\">"+h(g.name)+"</div>"
     + '<div class="row" style="gap:5px"><span class="tag '+GATE_STATUS[g.status].c+'">'+GATE_STATUS[g.status].i+" "+GATE_STATUS[g.status].t+"</span></div>"
     + '<div class="gmeta" style="margin-top:5px">'+g.reqs.filter(r=>["satisfied","waived","not_applicable"].includes(r.status)).length+"/"+g.reqs.length+" รายการ"
     + (g.due? ' · <span style="'+(late?"color:var(--bad);font-weight:700":"")+'">'+thDay(g.due)+"</span>":"")+"</div>"
     + (g.passedBy? '<div class="gmeta" style="margin-top:4px">เซ็น: '+h(user(g.passedBy).name)+"</div>":"")
     + "</div>";
  }).join("")+"</div>";

  return pageHead(c.name+" · "+(job.period? thPeriod(job.period):"งานโปรเจ็ค"),

      '<div class="row"><a class="btn" href="#/board">← กระดานงานเดือน</a></div>')

function gatePanel(job, g){
  const conds = gateConditions(job,g);
  const allOk = conds.every(c=>c.ok);
  const canReopen = can("gate.reopen",job);
  const reqs = g.reqs.map(r=>reqRow(job,g,r)).join("");
  const signer = g.overrideUser || resolveRole(g.signOffRole, eng(job.eng), job);

  let actions = "";
  if(g.status==="passed"){
    actions = '<div class="callout" style="border-color:var(--ok);background:var(--ok-bg);color:var(--ok-ink)">ผ่านแล้วเมื่อ '+thDate(g.passedAt)+' โดย '+h(user(g.passedBy).name)+(user(g.passedBy).kind==="api"?" (ผ่าน API)":"")+'</div>'
     + '<div class="row" style="margin-top:10px">'
     + '<button class="btn danger" '+(canReopen?"":"disabled title='ต้องเป็นรองหัวหน้าขึ้นไปในทีมนี้'")+' onclick="A.openReopen(\''+job.id+'\',\''+g.key+'\')">เปิดด่านนี้ใหม่</button>'
     + '<span class="tiny muted">เปิดใหม่ = ลายเซ็นเดิมยังอยู่ในประวัติ แต่ด่านหลังจากนี้จะถูกทำเครื่องหมาย “ต้องยืนยันใหม่”</span></div>';
  } else if(g.status==="failed"){
    actions = '<div class="callout warn"><b>ไม่ผ่าน</b> — '+h(g.failedReason)+'<div class="tiny" style="margin-top:4px">โดย '+h(user(g.failedBy).name)+" · "+thDate(g.failedAt)+(g.sendBack? " · ส่งกลับด่าน "+h(job.gates.find(x=>x.key===g.sendBack).name):"")+"</div></div>"
     + '<div class="row" style="margin-top:10px"><button class="btn" onclick="A.reopenNow(\''+job.id+'\',\''+g.key+'\')">กลับมาทำต่อ</button></div>';
  } else {
    const sign = canSign(job,g);
    actions = '<div class="card pad" style="background:#fbfaf8">'
     + '<div class="row" style="margin-bottom:6px"><b style="font-size:13px">กฎการเซ็นผ่าน — ต้องครบทั้งสี่ข้อ</b>'
     + '<span class="spacer"></span><span class="tiny muted">ไม่มีทางอื่นที่ทำให้ด่านเป็น “ผ่าน” ได้</span></div>'
     + conds.map(c=>'<div class="cond '+(c.ok?"yes":"no")+'"><span class="mark">'+(c.ok?"✓":"·")+'</span><span>'+h(c.t)+(c.d? ' <span class="tiny muted">— '+h(c.d)+"</span>":"")+"</span></div>").join("")
     + '<div class="row" style="margin-top:10px">'
     + '<button class="btn ok" '+(allOk?"":"disabled")+' onclick="A.passGate(\''+job.id+'\',\''+g.key+'\')">✓ เซ็นผ่านด่าน '+g.order+"</button>"
     + '<button class="btn danger" onclick="A.openFail(\''+job.id+'\',\''+g.key+'\')">ไม่ผ่าน / ส่งกลับ</button>'
     + (g.allowSkip? '<button class="btn" onclick="A.openSkip(\''+job.id+'\',\''+g.key+'\')">ข้ามด่านนี้</button>':"")
     + (can("job.assign",job)? '<button class="btn" onclick="A.openOverride(\''+job.id+'\',\''+g.key+'\')">มอบให้คนอื่นเซ็นแทน</button>':"")
     + '<span class="spacer"></span>'
     + (can("api.manage")? '<button class="btn bot" onclick="A.openApi(\''+job.id+'\',\''+g.key+'\')">⚙ ทดลองยิง API เปลี่ยนสถานะด่าน</button>':"")
     + "</div>"
     + (sign.ok? "" : '<div class="tiny muted" style="margin-top:6px">คุณ ('+ROLE_LABEL[S.me.role]+") "+h(sign.why)+"</div>")
     + "</div>";
  }

  return '<div class="card"><div class="cardhead"><h3>ด่าน '+g.order+" · "+h(g.name)+"</h3>"
   + '<span class="tag '+GATE_STATUS[g.status].c+'">'+GATE_STATUS[g.status].t+"</span>"+phBadge(2)+"<span class=spacer></span>"
   + '<span class="tiny muted">'+(g.due? "ครบกำหนด "+thDay(g.due):"")+"</span></div><div class=cardbody>"
   + '<div class="callout grey" style="margin-bottom:10px"><b>เกณฑ์ผ่านตาม SOP:</b> '+h(g.desc)+"</div>"
   + '<div class="grid g3" style="margin-bottom:10px">'
   + jf("ผู้ทำงาน (owner role)", ROLE_LABEL[g.ownerRole]+" → "+(user(g.owner)? h(user(g.owner).name):"—"))
   + jf("ผู้เซ็นผ่าน (sign-off role)", ROLE_LABEL[g.signOffRole]+" → "+(user(signer)? h(user(signer).name):"—")
        +(g.overrideUser? ' <span class="tag t-warn">เซ็นแทน</span>':""))
   + jf("ผ่านอัตโนมัติเมื่อครบทุกข้อ?", g.autoPass? '<span class="tag t-warn">เปิด</span>' : '<span class="tag t-grey">ปิด — ต้องมีคนเซ็นเสมอ</span>')
   + "</div>"
   + (g.overrideReason? '<div class="callout warn" style="margin-bottom:10px">มอบให้ '+h(user(g.overrideUser).name)+" เซ็นแทน — เหตุผล: "+h(g.overrideReason)+"</div>":"")
   + (g.reopened? '<div class="callout warn" style="margin-bottom:10px">ด่านนี้ถูกเปิดใหม่ '+g.reopened+" ครั้ง</div>":"")
   + (g.key==="intake"? intakeBox(job) : "")
   + '<h4 style="font-size:12.5px;margin:12px 0 2px">รายการที่ต้องทำ (Requirement) — '
   + g.reqs.filter(r=>["satisfied","waived","not_applicable"].includes(r.status)).length+"/"+g.reqs.length+"</h4>"
   + '<div class="tiny muted" style="margin-bottom:6px">แต่ละรายการมี “ชนิดหลักฐาน” ของตัวเอง — ติ๊กเฉย ๆ ไม่พอ</div>'
   + reqs
   + '<div style="margin-top:14px">'+actions+"</div>"
   + "</div></div>";
}

function intakeBox(job){

   + '<span class="spacer"></span><span class="tiny muted">ค่าเหล่านี้มาจาก Airtable ของจริง (ตัดที่ 20 ตัวอักษรในไฟล์ export)</span></div></div>';
}
A.setIntake = (jid,v) => { const j=byId(JOBS,jid); j.intake=v; audit(S.me.id,"job",j.id,"intake.updated","เปลี่ยนสถานะรับเอกสารเป็น "+v); toast("อัปเดตสถานะรับเอกสารแล้ว"); };

function reqRow(job,g,r){
  const done = ["satisfied","waived","not_applicable"].includes(r.status);
  const auto = !!r.auto;
  const cls = r.status==="satisfied" ? (r.by==="sys"||auto? "done auto":"done")
            : r.status==="waived" ? "waived" : r.status==="not_applicable" ? "na" : "";
  const clickable = !auto && g.status!=="passed" && can("requirement.satisfy",job);
  const evid = r.evidence.map(ev=>{
    if(ev.kind==="file")   return '<div class="tiny"><span class="tag t-grey">ไฟล์</span> <span class="mono">'+h(ev.path)+"</span> · "+person(ev.by)+" · "+thDate(ev.at)+"</div>";
    if(ev.kind==="keying_run") return '<div class="tiny"><span class="tag t-purple">รอบคีย์เอกสาร</span> <a href="#/keying/'+h(ev.run)+'">'+h(ev.run)+"</a> — "+h(ev.text)+"</div>";
    if(ev.kind==="link")   return '<div class="tiny"><span class="tag t-grey">ลิงก์</span> '+h(ev.url)+"</div>";
    return '<div class="tiny"><span class="tag t-grey">คำยืนยัน</span> '+h(ev.text||"")+" · "+person(ev.by)+" · "+thDate(ev.at)+"</div>";
  }).join("");
  return '<div class="reqrow">'
   + '<div class="reqbox '+cls+(clickable?"":" locked")+'" '+(clickable? 'onclick="A.openReq(\''+job.id+'\',\''+g.key+'\',\''+r.key+'\')"':'title="'+(auto?"ปิดโดยรอบคีย์เอกสารเท่านั้น":"คุณไม่มีสิทธิ์แก้รายการนี้")+'"')+'>'
   + (r.status==="satisfied"?"✓":r.status==="waived"?"~":r.status==="not_applicable"?"–":"")+"</div>"
   + '<div class="reqmain"><div class="reqname">'+h(r.name)+(r.req==="required"? ' <span class="tag t-bad" style="font-size:10px">บังคับ</span>':r.req==="conditional"? ' <span class="tag t-warn" style="font-size:10px">มีเงื่อนไข</span>':' <span class="tag t-grey" style="font-size:10px">ไม่บังคับ</span>')+"</div>"
   + '<div class="reqmeta"><span class="tag t-grey">'+KIND_LABEL[r.kind]+"</span>"
   + (auto? '<span class="tag t-purple">ปิดอัตโนมัติจาก '+h(r.auto)+"</span>":"")
   + (r.cond? '<span class="muted">เงื่อนไข: '+h(r.cond)+"</span>":"")
   + '<span class="muted">ผู้รับผิดชอบ: '+(user(r.assignee)? h(user(r.assignee).name):"—")+"</span>"
   + (done? '<span class="muted">'+REQ_STATUS[r.status].t+(r.at? " · "+thDate(r.at):"")+(r.by? " · โดย ":"")+"</span>"+(r.by? person(r.by):"") : '<span class="muted">'+REQ_STATUS[r.status].t+"</span>")
   + "</div>"+(evid? '<div style="margin-top:4px">'+evid+"</div>":"")
   + (r.waivedReason? '<div class="tiny" style="color:var(--warn-ink)">เหตุผลที่ยกเว้น: '+h(r.waivedReason)+"</div>":"")
   + "</div></div>";
}

/* ---------- จุดต่อกับสายคีย์เอกสาร (เฟส 4) ---------- */
function keyingSeam(job, g){
  if(g.key!=="keying") return "";
  const req = g.reqs.find(r=>r.auto==="ksk_keying.final_gate");
  const run = KEYING_RUNS.find(r=>r.id===req.run);
  const mayStart = can("run.start",job) && job.workspace;
  const stages = run? '<div class="tblwrap" style="margin-top:8px"><table class="data"><thead><tr><th>ขั้น</th><th>การตรวจหลักฐาน (Ledger Gate)</th><th>สถานะ</th></tr></thead><tbody>'
    + run.stages.map(s=>"<tr><td>"+h(s.label)+'</td><td class="tiny muted">'+h(s.gate)+'</td><td><span class="tag '+
      ({passed:"t-ok",running:"t-info",blocked:"t-bad",pending:"t-grey"}[s.status])+'">'+
      ({passed:"ผ่าน",running:"กำลังรัน",blocked:"ไม่ผ่าน — จอดรอมนุษย์",pending:"ยังไม่ถึง"}[s.status])+"</span></td></tr>").join("")
    + "</tbody></table></div>" : "";
  return '<div class="card"><div class="cardhead"><h3>รอบคีย์เอกสาร — จุดที่สายงานอัตโนมัติมาบรรจบกับด่าน</h3>'+phBadge(4)+"</div><div class=cardbody>"
   + '<div class="callout bot" style="margin-bottom:10px">การตรวจหลักฐานของสายคีย์เอกสาร (Ledger Gate) เป็น <b>หลักฐานหนึ่งชิ้น</b>ของรายการเดียวในด่านนี้เท่านั้น — ไม่มีทางทำให้ด่านผ่านได้เอง และไม่มีมนุษย์คนไหนกด “ผ่าน” ให้ Ledger Gate ได้เช่นกัน</div>'
   + (run? '<div class="row"><b>'+h(run.id)+'</b><span class="tag '+({done:"t-ok",running:"t-info",blocked:"t-bad"}[run.status])+'">'
      + ({done:"เสร็จ",running:"กำลังรัน",blocked:"จอดรอมนุษย์"}[run.status])+"</span>"
      + '<span class="tiny muted">เริ่ม '+thDate(run.started)+(run.finished? " · จบ "+thDate(run.finished):"")+" · โดย "+h(user(run.startedBy).name)+"</span>"

A.passGate = (jid,key) => {
  const job=byId(JOBS,jid), g=job.gates.find(x=>x.key===key);
  if(!gateConditions(job,g).every(c=>c.ok)){ toast("ยังผ่านเงื่อนไขไม่ครบสี่ข้อ"); return; }
  g.status="passed"; g.passedBy=S.me.id; g.passedAt=nowStamp(); g.failedReason=null;
  audit(S.me.id,"job_gate",jid+"#"+key,"gate.passed","เซ็นผ่านด่าน "+g.order+" "+g.name);
  const next = job.gates.find(x=>x.order===g.order+1);
  if(next && next.status==="pending") next.status="in_progress";
  toast("เซ็นผ่านด่าน "+g.order+" "+g.name+" แล้ว","บันทึกชื่อผู้เซ็น เวลา และเหตุการณ์ลงประวัติเรียบร้อย");
  render();
};
A.openFail = (jid,key) => openModal("fail",{jid,key});
A.doFail = (jid,key) => {
  const reason=(document.getElementById("f-reason")||{}).value||"";
  const back=(document.getElementById("f-back")||{}).value||"";
  if(!reason.trim()){ toast("ต้องระบุเหตุผลที่ไม่ผ่าน"); return; }
  const job=byId(JOBS,jid), g=job.gates.find(x=>x.key===key);
  g.status="failed"; g.failedReason=reason; g.failedBy=S.me.id; g.failedAt=nowStamp(); g.sendBack=back||null;
  if(back){ const b=job.gates.find(x=>x.key===back); if(b){ b.status="in_progress"; b.reopened=(b.reopened||0)+1;
    job.gates.filter(x=>x.order>b.order && x.status==="passed").forEach(x=>{ x.status="stale"; }); } }
  audit(S.me.id,"job_gate",jid+"#"+key,"gate.failed",reason+(back?" · ส่งกลับด่าน "+job.gates.find(x=>x.key===back).name:""));
  closeModal(); toast("บันทึกว่าด่านนี้ไม่ผ่าน","สถานะงานเปลี่ยนเป็น “มีปัญหา” และด่านหลังจากจุดที่ส่งกลับกลายเป็น “ต้องยืนยันใหม่”");

A.openReq = (jid,gk,rk) => openModal("req",{jid,gk,rk});
A.doReq = (jid,gk,rk,how) => {
  const job=byId(JOBS,jid), g=job.gates.find(x=>x.key===gk), r=g.reqs.find(x=>x.key===rk);
  const val=(document.getElementById("req-val")||{}).value||"";
  const reason=(document.getElementById("req-reason")||{}).value||"";
  if(how==="satisfy"){
    if(r.kind==="file" && !val.trim()){ toast("ระบุพาธไฟล์ที่ใช้เป็นหลักฐาน"); return; }
    r.status="satisfied"; r.by=S.me.id; r.at=nowStamp();
    r.evidence.push(r.kind==="file" ? {kind:"file",path:val,by:S.me.id,at:r.at}
      : r.kind==="external_link" ? {kind:"link",url:val||"—",by:S.me.id,at:r.at}
      : {kind:"attestation",text:val||"ยืนยันด้วยตนเอง",by:S.me.id,at:r.at});
    audit(S.me.id,"job_requirement",jid+"#"+gk+"/"+rk,"requirement.satisfied",r.name);
  } else if(how==="waive"){
    if(!reason.trim()){ toast("การยกเว้นต้องมีเหตุผล"); return; }
    r.status="waived"; r.waivedReason=reason; r.by=S.me.id; r.at=nowStamp();
    audit(S.me.id,"job_requirement",jid+"#"+gk+"/"+rk,"requirement.waived",r.name+" — "+reason);
  } else if(how==="na"){
    r.status="not_applicable"; r.by=S.me.id; r.at=nowStamp();
    audit(S.me.id,"job_requirement",jid+"#"+gk+"/"+rk,"requirement.not_applicable",r.name);
  } else {
    r.status="pending"; r.by=null; r.at=null; r.evidence=[]; r.waivedReason=null;
    audit(S.me.id,"job_requirement",jid+"#"+gk+"/"+rk,"requirement.reset","ยกเลิกการทำเครื่องหมาย "+r.name);
  }
  closeModal();
};

/* ---------- เริ่มรอบคีย์เอกสาร (จำลอง — ไม่มีการเรียกจริง ไม่มีค่าใช้จ่าย) ---------- */
A.startRun = jid => {
  const job=byId(JOBS,jid);
  const g=job.gates.find(x=>x.key==="keying"); const req=g.reqs.find(r=>r.auto==="ksk_keying.final_gate");
  const run=mkRun({id:"kr-"+(500+KEYING_RUNS.length), job:jid, path:job.workspace, started:nowStamp(), finished:null,
    status:"running", doneThrough:-1, runningStatus:"running", units:0, reviewed:0, excluded:0, retries:0, humanStops:0,
    cost:0, startedBy:S.me.id, log:["เริ่มรอบคีย์ (จำลองในตัวอย่าง)"]});
  req.run=run.id; req.status="in_progress";
  audit(S.me.id,"keying_run",run.id,"run.started","เริ่มรอบคีย์เอกสาร "+run.id+" จากด่าน 2");
  toast("เริ่มรอบคีย์เอกสาร (จำลอง)","ตัวอย่างนี้ไม่เรียก pipeline จริงและไม่มีค่าใช้จ่าย");
  let i=0;
  const tick=setInterval(()=>{
    run.stages[i].status="passed"; run.units=120+i*46; i++;
    if(i<run.stages.length){ run.stages[i].status="running"; }
    else{
      clearInterval(tick);
      run.status="done"; run.finished=nowStamp(); run.reviewed=run.units-14; run.excluded=14; run.cost=29.7;
      req.status="satisfied"; req.by="sys"; req.at=run.finished;
      req.evidence=[{kind:"keying_run",run:run.id,by:"sys",at:run.finished,
        text:"รอบคีย์ "+run.id+" ผ่านการตรวจหลักฐานครบทุกด่าน (units "+run.units+" / reviewed "+run.reviewed+" / excluded "+run.excluded+")"}];
      audit("sys","job_requirement",jid+"#keying/"+req.key,"requirement.satisfied","ปิดอัตโนมัติจากรอบคีย์ "+run.id+" (final gate exit 0)");
      toast("รอบคีย์เอกสารเสร็จ","รายการ “เอกสารถูกคีย์ครบทุกหน้า” ถูกปิดโดยระบบ พร้อมแนบรอบคีย์เป็นหลักฐาน — ด่านยังต้องมีคนเซ็น");
    }
    render();
  }, 700);
  render();
};

A.openApi = (jid,key) => openModal("api",{jid,key});
A.doApi = (jid,key,action) => {
  const job=byId(JOBS,jid), g=job.gates.find(x=>x.key===key);
  const actor="api-ksk-ai";
  if(action==="pass"){
    const conds=gateConditions(job,g);
    if(!conds[0].ok){ toast("API ก็ผ่านกฎสี่ข้อไม่ได้","ผู้เรียกผ่าน API ถูกตรวจเหมือนคน — รายการที่บังคับยังไม่ครบ"); return; }
    g.status="passed"; g.passedBy=actor; g.passedAt=nowStamp();
    audit(actor,"job_gate",jid+"#"+key,"gate.passed","เปลี่ยนสถานะด่านผ่าน API: POST /api/v1/jobs/"+jid+"/gates/"+key+" {\"to\":\"passed\"}");
    const next=job.gates.find(x=>x.order===g.order+1); if(next&&next.status==="pending") next.status="in_progress";
    toast("ด่านถูกเปลี่ยนสถานะโดยผู้เรียกผ่าน API","ใน timeline จะเห็นเป็น actor คนละแบบกับมนุษย์");
  } else if(action==="satisfy"){
    const r=g.reqs.find(x=>x.status!=="satisfied"&&!x.auto);
    if(!r){ toast("ไม่มีรายการที่ค้างให้ปิด"); return; }
    r.status="satisfied"; r.by=actor; r.at=nowStamp();
    r.evidence.push({kind:"attestation",text:"ปิดโดย workflow ภายนอกผ่าน API",by:actor,at:r.at});
    audit(actor,"job_requirement",jid+"#"+key+"/"+r.key,"requirement.satisfied","ปิดผ่าน API: "+r.name);
    toast("รายการถูกปิดโดย KSK AI Workflow","actor เป็นของตัวเอง ไม่ยืมชื่อพนักงานคนไหน");
  } else {
    g.status="in_progress"; g.failedReason=null;
    audit(actor,"job_gate",jid+"#"+key,"gate.reopened","เปิดด่านใหม่ผ่าน API");
    toast("ด่านถูกเปิดใหม่โดยผู้เรียกผ่าน API");
  }
  const cl=API_CLIENTS.find(a=>a.id===actor); cl.lastUsed=nowStamp();
  closeModal();
};

   + '<div class="card pad" style="margin-top:14px"><h3 style="font-size:13px">ประวัติเวอร์ชัน — งานบัญชีรายเดือน</h3>'
   + '<div class="tl" style="margin-top:8px">'
   + '<div class="tlitem"><div class="when">20 มิ.ย. 2569</div><div class="what"><b>v2 เผยแพร่</b> โดย ต้น — เพิ่มด่าน 6 เก็บเงินลูกค้า ตาม SOP v2 §8</div></div>'
   + '<div class="tlitem"><div class="when">2 พ.ค. 2569</div><div class="what"><b>v1 เก็บเข้าคลัง</b> — 5 ด่าน ตาม SOP v1</div></div>'
   + '<div class="tlitem"><div class="when">28 ก.ค. 2569</div><div class="what"><b>v3 ร่าง</b> โดย ไหม — ยังไม่เผยแพร่ ไม่มีงานไหนใช้</div></div>'

function viewTemplate(){
  const t = byId(TEMPLATES, param(2));
  if(!t) return '<div class="card pad">ไม่พบแม่แบบ</div>';
  if(!t.gates.length && t.base){                 // ร่างที่ยังไม่แตกเนื้อหา — ถ่ายจากเวอร์ชันฐาน
    t.gates = clone(tpl(t.base).gates);
    t.gates[1].reqs.splice(1,0,{key:"etax_check",name:"ตรวจ e-Tax invoice ที่ได้รับจากกรมสรรพากร",kind:"file",req:"required",assignee:"job_assignee"});
  }
  const editable = can("template.edit") && t.status==="draft";
  const usage = ENGAGEMENTS.filter(e=>e.tpl===t.id);

  const head = pageHead(t.name+" · v"+t.version,
      h(SERVICE_LABEL[t.service])+" · "+(t.status==="published"?"เผยแพร่แล้ว":"ร่าง — ยังไม่มีงานไหนใช้")
      + (t.note? " · "+h(t.note):""), 2,
      '<div class="row">'
      + (t.status==="published" && can("template.edit")? '<button class="btn" onclick="A.newDraft(\''+t.id+'\')">สร้างร่างเวอร์ชันใหม่จากเวอร์ชันนี้</button>':"")
      + (editable? '<button class="btn" onclick="A.addGate(\''+t.id+'\')">+ เพิ่มด่าน</button>'
                 + '<button class="btn primary" onclick="A.publish(\''+t.id+'\')">เผยแพร่เวอร์ชันนี้</button>':"")
      + '<a class="btn" href="#/templates">← รายการแม่แบบ</a></div>');

  const note = editable
    ? '<div class="callout" style="margin-bottom:12px">กำลังแก้ <b>ร่าง</b> — แก้ได้อิสระ ยังไม่มีผลกับใคร เมื่อกด “เผยแพร่” เวอร์ชันนี้จะกลายเป็นเวอร์ชันที่ใช้กับงานที่สร้างใหม่หลังจากนั้น</div>'
    : (t.status==="published"
      ? '<div class="callout grey" style="margin-bottom:12px">เวอร์ชันที่เผยแพร่แล้วแก้ไม่ได้ '+(can("template.edit")? "— กด “สร้างร่างเวอร์ชันใหม่” เพื่อแก้" : "— และบทบาท "+ROLE_LABEL[S.me.role]+" ไม่มีสิทธิ์แก้แม่แบบ")+"</div>"
      : "");

  const gates = t.gates.map((g,gi)=>designerGate(t,g,gi,editable)).join("");

  const usageBox = '<div class="card pad" style="margin-top:14px"><h3 style="font-size:13px;margin-bottom:6px">ผูกอยู่กับบริการ '+usage.length+" รายการ</h3>"
   + (usage.length? usage.map(e=>'<div class="tiny"><a href="#/customers/'+e.cust+'">'+h(cust(e.cust).name)+"</a> · "+h(e.title||SERVICE_LABEL[e.type])+"</div>").join("")
     : '<div class="tiny muted">ยังไม่มีบริการไหนใช้แม่แบบนี้</div>')
   + '<div class="tiny muted" style="margin-top:6px">งานที่เปิดไปแล้วใช้สำเนาของแม่แบบ ณ วันที่สร้างงาน จึงไม่เปลี่ยนตามการแก้ครั้งนี้</div></div>';

  return head + note + gates + usageBox;
}

function designerGate(t,g,gi,ed){
  const roleOpts = (v,on) => Object.keys(ROLE_LABEL).map(r=>'<option value="'+r+'" '+(r===v?"selected":"")+">"+ROLE_LABEL[r]+"</option>").join("");
  const f=(lbl,inner)=>'<div><div class="tiny muted">'+lbl+"</div>"+inner+"</div>";
  const dis = ed? "" : "disabled";
  const reqs = g.reqs.map((r,ri)=>'<div class="dg-req">'
    + (ed? '<span class="drag" title="ลากเพื่อเรียงลำดับ (ตัวอย่างนี้ใช้ปุ่มลูกศร)">⠿</span>':"")
    + '<input type="text" value="'+h(r.name)+'" '+dis+' onchange="A.trSet(\''+t.id+'\','+gi+','+ri+',\'name\',this.value)" style="flex:2">'
    + '<select '+dis+' onchange="A.trSet(\''+t.id+'\','+gi+','+ri+',\'kind\',this.value)" style="width:150px">'
      + Object.keys(KIND_LABEL).map(k=>'<option value="'+k+'" '+(k===r.kind?"selected":"")+">"+KIND_LABEL[k]+"</option>").join("")+"</select>"
    + '<select '+dis+' onchange="A.trSet(\''+t.id+'\','+gi+','+ri+',\'req\',this.value)" style="width:120px">'
      + ["required","optional","conditional"].map(k=>'<option value="'+k+'" '+(k===r.req?"selected":"")+">"+({required:"บังคับ",optional:"ไม่บังคับ",conditional:"มีเงื่อนไข"}[k])+"</option>").join("")+"</select>"
    + (r.auto? '<span class="tag t-purple" title="ปิดอัตโนมัติจากระบบภายนอก">auto: '+h(r.auto)+"</span>":"")
    + (ed? '<button class="btn small danger" onclick="A.trDel(\''+t.id+'\','+gi+','+ri+')">ลบ</button>':"")
    + "</div>").join("");

  return '<div class="designer-gate"><div class="dg-head">'
   + '<span class="tag t-grey">ด่าน '+g.order+"</span>"
   + '<input type="text" value="'+h(g.name)+'" '+dis+' onchange="A.tgSet(\''+t.id+'\','+gi+',\'name\',this.value)" style="max-width:280px;font-weight:700">'
   + '<span class="spacer"></span>'
   + (ed? '<button class="btn small" onclick="A.tgMove(\''+t.id+'\','+gi+',-1)">↑</button>'
        + '<button class="btn small" onclick="A.tgMove(\''+t.id+'\','+gi+',1)">↓</button>'
        + '<button class="btn small danger" onclick="A.tgDel(\''+t.id+'\','+gi+')">ลบด่าน</button>':"")
   + "</div><div class=dg-body>"
   + '<div class="grid g4" style="margin-bottom:8px">'
   + f("ผู้ทำงาน (owner role)", '<select '+dis+' onchange="A.tgSet(\''+t.id+'\','+gi+',\'owner\',this.value)">'+roleOpts(g.owner)+"</select>")
   + f("ผู้เซ็นผ่าน (sign-off role)", '<select '+dis+' onchange="A.tgSet(\''+t.id+'\','+gi+',\'signOff\',this.value)">'+roleOpts(g.signOff)+"</select>")
   + f("ครบกำหนดวันที่ (ของเดือนถัดไป)", '<input type="number" min="1" max="31" value="'+g.sla+'" '+dis+' onchange="A.tgSet(\''+t.id+'\','+gi+',\'sla\',+this.value)">')
   + f("คีย์ถาวร (ใช้กับระบบอัตโนมัติ)", '<input type="text" class="readonly mono" value="'+h(g.key)+'" disabled>')
   + "</div>"
   + '<div class="field"><label class="fl">เกณฑ์ผ่าน (ข้อความที่คนทำงานเห็น — ถอดจาก SOP)</label>'
   + '<textarea rows="2" '+dis+' onchange="A.tgSet(\''+t.id+'\','+gi+',\'desc\',this.value)">'+h(g.desc)+"</textarea></div>"
   + '<div class="row" style="margin-bottom:8px">'
   + '<label class="tiny row" style="gap:5px"><input type="checkbox" '+(g.blocks?"checked":"")+" "+dis+' onchange="A.tgSet(\''+t.id+'\','+gi+',\'blocks\',this.checked)" style="width:auto"> กั้นด่านถัดไปจนกว่าจะผ่าน</label>'
   + '<label class="tiny row" style="gap:5px"><input type="checkbox" '+(g.skip?"checked":"")+" "+dis+' onchange="A.tgSet(\''+t.id+'\','+gi+',\'skip\',this.checked)" style="width:auto"> อนุญาตให้ข้ามได้ (ต้องมีเหตุผล)</label>'
   + '<label class="tiny row" style="gap:5px" title="มติกัปตันข้อ 4: ด่านไม่ผ่านเอง"><input type="checkbox" disabled style="width:auto"> ผ่านอัตโนมัติเมื่อครบทุกรายการ <span class="tag t-grey">ปิดถาวร</span></label>'
   + "</div>"
   + '<div class="row" style="margin-bottom:4px"><b class="tiny">รายการที่ต้องทำ ('+g.reqs.length+")</b>"
   + '<span class="spacer"></span>'+(ed? '<button class="btn small" onclick="A.trAdd(\''+t.id+'\','+gi+')">+ เพิ่มรายการ</button>':"")+"</div>"
   + reqs
   + "</div></div>";
}
A.tgSet = (tid,gi,f,v) => { tpl(tid).gates[gi][f]=v; render(); };
A.trSet = (tid,gi,ri,f,v) => { tpl(tid).gates[gi].reqs[ri][f]=v; render(); };
A.trAdd = (tid,gi) => { tpl(tid).gates[gi].reqs.push({key:"new_"+(SEQ++),name:"รายการใหม่",kind:"attestation",req:"required",assignee:"gate_owner"}); render(); };
A.trDel = (tid,gi,ri) => { tpl(tid).gates[gi].reqs.splice(ri,1); render(); };
A.addGate = tid => { const t=tpl(tid); t.gates.push({order:t.gates.length+1,key:"gate_"+(SEQ++),name:"ด่านใหม่",owner:"staff",signOff:"lead",
  sla:20,blocks:true,skip:false,autoPass:false,desc:"",reqs:[]}); render(); };
A.tgDel = (tid,gi) => { const t=tpl(tid); t.gates.splice(gi,1); t.gates.forEach((g,i)=>g.order=i+1); render(); };
A.tgMove = (tid,gi,d) => { const t=tpl(tid), j=gi+d; if(j<0||j>=t.gates.length) return;
  const [x]=t.gates.splice(gi,1); t.gates.splice(j,0,x); t.gates.forEach((g,i)=>g.order=i+1); render(); };
A.newDraft = tid => {
  const base=tpl(tid);
  const d={id:base.id+"-d"+(SEQ++),name:base.name,service:base.service,version:base.version+1,status:"draft",
    createdBy:S.me.id,publishedAt:null,note:"ร่างที่สร้างจาก v"+base.version+" โดย "+S.me.name,gates:clone(base.gates)};
  TEMPLATES.push(d); audit(S.me.id,"gate_template",d.id,"template.draft_created","สร้างร่าง v"+d.version+" จาก "+base.name+" v"+base.version);
  go("#/templates/"+d.id); toast("สร้างร่าง v"+d.version+" แล้ว","แก้ได้เต็มที่ ยังไม่มีผลกับงานใด");
};
A.publish = tid => {
  const t=tpl(tid);
  TEMPLATES.filter(x=>x.service===t.service && x.status==="published" && x.id!==t.id).forEach(x=>{ x.status="archived"; });
  t.status="published"; t.publishedAt=TODAY;
  ENGAGEMENTS.filter(e=>e.type===t.service).forEach(e=>{ e.tpl=t.id; });
  audit(S.me.id,"gate_template",t.id,"template.published","เผยแพร่ "+t.name+" v"+t.version);
  toast("เผยแพร่ v"+t.version+" แล้ว","งานที่สร้างหลังจากนี้จะใช้เวอร์ชันนี้ · งานเดิมยังใช้สำเนาเวอร์ชันที่ถูกเซ็นไปแล้ว");
  render();
};

function modalHost(){
  if(!S.modal) return "";
  const m=S.modal;
  if(m.kind==="switch") return modalSwitch();
  const job = m.jid? byId(JOBS,m.jid) : null;
  const gate = job && m.key? job.gates.find(g=>g.key===m.key) : null;

  if(m.kind==="fail"){
    const opts = job.gates.filter(g=>g.order<gate.order).map(g=>'<option value="'+g.key+'">ด่าน '+g.order+" "+h(g.name)+"</option>").join("");
    return modalShell("ไม่ผ่านด่าน "+gate.order+" · "+gate.name,
      '<div class="field"><label class="fl">เหตุผล (บังคับ — จะถูกเก็บเป็นหลักฐาน)</label><textarea id="f-reason" rows="3" placeholder="เช่น ยอดลูกหนี้ไม่ตรงกับรายงานอายุลูกหนี้"></textarea></div>'
     + '<div class="field"><label class="fl">ส่งกลับไปด่านไหน</label><select id="f-back"><option value="">ไม่ส่งกลับ (แก้ที่ด่านนี้)</option>'+opts+"</select></div>"
     + '<div class="callout warn">ด่านที่ผ่านไปแล้วหลังจากจุดที่ส่งกลับจะถูกทำเครื่องหมาย “ต้องยืนยันใหม่” — ลายเซ็นเดิมไม่ถูกลบ แต่งานจะปิดไม่ได้จนกว่าจะยืนยันซ้ำ</div>',
      '<button class="btn" onclick="A.close()">ยกเลิก</button><button class="btn danger" onclick="A.doFail(\''+m.jid+'\',\''+m.key+'\')">บันทึกว่าไม่ผ่าน</button>');
  }
  if(m.kind==="reopen") return modalShell("เปิดด่าน "+gate.order+" ใหม่",
      '<div class="field"><label class="fl">เหตุผล (บังคับ)</label><textarea id="r-reason" rows="3" placeholder="เช่น พบใบกำกับภาษีเพิ่มหลังเซ็นผ่านแล้ว"></textarea></div>'
     + '<div class="callout warn">ลายเซ็นของ '+(gate.passedBy? h(user(gate.passedBy).name):"—")+' ยังอยู่ในประวัติ ระบบไม่ลบทิ้ง แต่ด่านหลังจากนี้จะกลายเป็น “ต้องยืนยันใหม่”</div>',
      '<button class="btn" onclick="A.close()">ยกเลิก</button><button class="btn danger" onclick="A.doReopen(\''+m.jid+'\',\''+m.key+'\')">เปิดใหม่</button>');
  if(m.kind==="skip") return modalShell("ข้ามด่าน "+gate.order,
      '<div class="field"><label class="fl">เหตุผล (บังคับ)</label><textarea id="s-reason" rows="3" placeholder="เช่น ลูกค้าไม่มีรายการต้องยื่นในเดือนนี้"></textarea></div>'
     + '<div class="callout grey">“ข้าม” ไม่เท่ากับ “ผ่าน” — ในรายงานจะแยกกัน</div>',
      '<button class="btn" onclick="A.close()">ยกเลิก</button><button class="btn" onclick="A.doSkip(\''+m.jid+'\',\''+m.key+'\')">ข้ามด่านนี้</button>');
  if(m.kind==="override"){
    const opts = USERS.filter(u=>["deputy","lead","executive","admin"].includes(u.role))
      .map(u=>'<option value="'+u.id+'">'+h(u.name)+" · "+ROLE_LABEL[u.role]+(u.team? " · "+h(byId(TEAMS,u.team).name):"")+"</option>").join("");
    return modalShell("มอบให้คนอื่นเซ็นแทน (ข้ามทีมได้)",
      '<div class="field"><label class="fl">ผู้เซ็นแทน</label><select id="o-user">'+opts+"</select></div>"
     + '<div class="field"><label class="fl">เหตุผล (บังคับ)</label><input type="text" id="o-reason" placeholder="เช่น หัวหน้าทีมลาหยุด"></div>'
     + '<div class="callout">เหตุผลบังคับเสมอ เพราะการเซ็นข้ามสายบังคับบัญชาคือสิ่งที่ต้องตอบได้ภายหลัง</div>',
      '<button class="btn" onclick="A.close()">ยกเลิก</button><button class="btn primary" onclick="A.doOverride(\''+m.jid+'\',\''+m.key+'\')">บันทึก</button>');
  }
  if(m.kind==="reassign"){
    const opts = USERS.filter(u=>["staff","intern","deputy","lead"].includes(u.role))
      .map(u=>'<option value="'+u.id+'" '+(u.id===job.assignee?"selected":"")+">"+h(u.name)+" · "+ROLE_LABEL[u.role]+(u.team? " · "+h(byId(TEAMS,u.team).name):"")+"</option>").join("");
    return modalShell("เปลี่ยนผู้รับผิดชอบงานนี้",
      '<div class="field"><label class="fl">ผู้รับผิดชอบ</label><select id="ra-user">'+opts+"</select></div>"
     + '<div class="callout grey">ค่าตั้งต้นมาจากบริการ (Engagement) — เปลี่ยนเฉพาะงวดนี้ได้โดยไม่กระทบงวดอื่น</div>',
      '<button class="btn" onclick="A.close()">ยกเลิก</button><button class="btn primary" onclick="A.doReassign(\''+m.jid+'\')">บันทึก</button>');
  }
  if(m.kind==="req"){
    const r = gate.reqs.find(x=>x.key===m.rk);
    const done = ["satisfied","waived","not_applicable"].includes(r.status);
    const inputLabel = {file:"พาธไฟล์ใน Dropbox ที่ใช้เป็นหลักฐาน",external_link:"ลิงก์",attestation:"บันทึกเพิ่มเติม (ไม่บังคับ)",none:"บันทึกเพิ่มเติม",metric:"ค่าที่วัดได้"}[r.kind]||"บันทึก";
    const ph = r.kind==="file" ? (byId(JOBS,m.jid).workspace||"")+"/กล่องรับเอกสาร/…" : "";
    return modalShell("รายการ: "+r.name,
      '<div class="row" style="margin-bottom:10px"><span class="tag t-grey">ชนิดหลักฐาน: '+KIND_LABEL[r.kind]+"</span>"
      + '<span class="tag '+(r.req==="required"?"t-bad":"t-grey")+'">'+({required:"บังคับ",optional:"ไม่บังคับ",conditional:"มีเงื่อนไข"}[r.req])+"</span>"
      + '<span class="tag t-grey">สถานะตอนนี้: '+REQ_STATUS[r.status].t+"</span></div>"
      + (r.kind==="none"? "" : '<div class="field"><label class="fl">'+h(inputLabel)+'</label><input type="text" id="req-val" placeholder="'+h(ph)+'"></div>')

function viewExceptions(){
  const open = EXCEPTIONS.filter(x=>!x.resolved), closed = EXCEPTIONS.filter(x=>x.resolved);
  const jobsWithDue = visibleJobs().filter(j=>j.period===S.period).map(j=>({j,g:currentGate(j)})).filter(x=>x.g&&x.g.due);
  const late = jobsWithDue.filter(x=>x.g.due<TODAY);
  const soon = jobsWithDue.filter(x=>x.g.due>=TODAY && daysBetween(TODAY,x.g.due)<=7);

  const exRow = x => {
    const job=byId(JOBS,x.job), c=cust(job.cust);
    return '<tr class="clickable" onclick="A.go(\'#/jobs/'+job.id+'\')">'
     + "<td><b>"+h(c.name)+'</b><div class="tiny muted">'+h(job.period? thPeriod(job.period):"")+"</div></td>"
     + '<td><span class="tag '+(x.sev==="critical"?"t-bad":x.sev==="warning"?"t-warn":"t-info")+'">'+({document_delay:"เอกสารช้า",client_unconfirmed:"ลูกค้ายังไม่ยืนยัน",late_filing:"ยื่นล่าช้า",data_issue:"ข้อมูลมีปัญหา",other:"อื่น ๆ"}[x.kind])+"</span></td>"
     + "<td>"+h(x.title)+'<div class="tiny muted">'+h(x.desc.slice(0,90))+"</div></td>"
     + "<td>"+person(x.by)+'</td><td class="tiny">'+thDate(x.at)+"</td>"
     + '<td class="tiny">'+({line:"LINE",email:"อีเมล",phone:"โทรศัพท์",in_person:"พบตัว"}[x.via])+" · "+thDay(x.notified)+"</td>"
     + '<td class="tiny">'+(x.resolved? '<span class="tag t-ok">ปิดแล้ว '+thDay(x.resolved)+"</span>" : '<span class="tag t-warn">เปิด '+daysBetween(x.at.split(" ")[0],TODAY)+" วัน</span>")+"</td></tr>";
  };

  return pageHead("ข้อยกเว้น & กำหนดส่ง",
     "Exception เป็นหลักฐานว่าความล่าช้าเริ่มที่ไหน · การเร่งงานใช้เกณฑ์วันที่ 7 / 10 ตาม SOP v2 §3.4", 3)
   + '<div class="grid g4" style="margin-bottom:14px">'
   + kpi("Exception ที่ยังเปิด", open.length, "ทั้งสำนักงาน")
   + kpi("งานที่เลยกำหนดด่าน", late.length, "ในงวด "+thPeriod(S.period))
   + kpi("ใกล้ครบกำหนด ≤7 วัน", soon.length, "ควรตามก่อนถึงกำหนด")
   + kpi("ปิดไปแล้วเดือนนี้", closed.length, "เก็บไว้เป็นหลักฐานถาวร")
   + "</div>"
   + '<div class="card" style="margin-bottom:14px"><div class="cardhead"><h3>Exception ที่ยังเปิดอยู่</h3></div>'
   + '<table class="data"><thead><tr><th>ลูกค้า</th><th>ประเภท</th><th>เรื่อง</th><th>เปิดโดย</th><th>เมื่อ</th><th>แจ้งลูกค้า</th><th>อายุ</th></tr></thead><tbody>'
   + (open.length? open.map(exRow).join("") : '<tr><td colspan="7" class="muted" style="text-align:center;padding:16px">ไม่มี</td></tr>')+"</tbody></table></div>"
   + '<div class="grid g2" style="align-items:start">'
   + '<div class="card"><div class="cardhead"><h3>กำหนดส่งของด่านปัจจุบัน</h3><span class="tag t-grey">'+thPeriod(S.period)+"</span></div>"
   + '<table class="data"><thead><tr><th>ลูกค้า</th><th>ด่าน</th><th>ผู้รับผิดชอบ</th><th>ครบกำหนด</th><th>สถานะ</th></tr></thead><tbody>'
   + jobsWithDue.sort((a,b)=>a.g.due<b.g.due?-1:1).map(x=>{
       const l = x.g.due<TODAY, s = l? "เลยกำหนด "+daysBetween(x.g.due,TODAY)+" วัน" : "เหลือ "+daysBetween(TODAY,x.g.due)+" วัน";
       return '<tr class="clickable" onclick="A.go(\'#/jobs/'+x.j.id+'\')"><td>'+h(cust(x.j.cust).name)+"</td>"
        + '<td class="tiny">ด่าน '+x.g.order+" "+h(x.g.name)+"</td><td>"+person(x.j.assignee)+'</td><td class="tiny">'+thDay(x.g.due)+"</td>"

   + '<div class="tlitem"><div class="when">วันที่ 8–10</div><div class="what">ตามลูกค้าที่ยังไม่ส่ง / ส่งไม่ครบ · นัดรับเอกสารจริง</div></div>'
   + '<div class="tlitem"><div class="when">หลังวันที่ 10</div><div class="what">เปิด Document Delay Exception และแจ้งลูกค้าว่า timeline เลื่อน</div></div>'
   + "</div>"
   + '<div class="callout" style="margin-top:10px">แจ้งเตือนอยู่ในระบบก่อน (กระดิ่ง + สรุปรายวัน) · ช่องทาง LINE/อีเมลวางไว้หลัง adapter ตามมติกัปตันข้อ 6</div></div>'
   + "</div>";
}

function viewReports(){
  const heat = v => { const p=Math.round(v*100); const bg = p>=95? "#dcfce7": p>=85? "#ecfccb": p>=70? "#fef3c7":"#fee2e2";
    const fg = p>=95? "#166534": p>=85? "#3f6212": p>=70? "#92400e":"#991b1b";
    return '<span class="heat" style="background:'+bg+";color:"+fg+'">'+p+"%</span>"; };
  const yearRows = MONTHLY.map(m=>"<tr><td><b>"+h(thPeriod(m.p))+"</b></td>"
    + '<td class="m">'+m.total+'</td><td class="m">'+heat(m.done/m.total)+'</td>'
    + '<td class="m">'+m.working+'</td><td class="m">'+m.waiting+'</td><td class="m">'+m.problem+'</td>'
    + '<td class="m">'+(m.avgDays? m.avgDays+" วัน":'<span class="muted">ยังไม่จบงวด</span>')+"</td>"
    + '<td class="m">'+money(m.revenue)+"</td></tr>").join("");

  const workload = USERS.filter(u=>["staff","intern","deputy","lead"].includes(u.role)).map(u=>{
    const mine = JOBS.filter(j=>j.assignee===u.id);
    const load = u.jobs;
    const cls = load>=12? "t-bad" : load>=9? "t-warn":"t-ok";

   + '<ul class="tiny" style="margin:6px 0 0;padding-left:18px;line-height:1.9"><li>ประเภทของค่าบริการ (รายเดือน/รายปี/ครั้งเดียว/งานเพิ่ม)</li><li>ใครออกใบแจ้งหนี้ และออกเมื่อไหร่</li><li>กระทบยอดค่าบริการกับงานที่ทำจริง</li><li>เช็คเงินเข้า และการตามลูกค้าที่ยังไม่จ่าย</li></ul></div>';
}

/* ==================================================================
   10. ตัวเดินเรื่อง (router + render)
   ================================================================== */
function body(){
  const r = route();
  if(r.startsWith("#/jobs/"))      return viewJob();
  if(r.startsWith("#/customers/")) return viewCustomer();
  if(r==="#/customers")            return viewCustomers();
  if(r.startsWith("#/templates/")) return viewTemplate();
  if(r==="#/templates")            return viewTemplates();
  if(r.startsWith("#/keying"))     return viewKeying();
  if(r==="#/exceptions")           return viewExceptions();
  if(r==="#/reports")              return viewReports();
  if(r==="#/collections")          return viewCollections();
  if(r==="#/admin/users")          return can("user.manage")? viewAdminUsers() : denied();
  if(r==="#/admin/system")         return can("api.manage")? viewAdminSystem() : denied();
  if(r==="#/audit")                return viewAudit();
  return viewBoard();
}
function denied(){
  return '<div class="card pad"><h3>ไม่มีสิทธิ์เข้าหน้านี้</h3>'
   + '<div class="hint" style="margin-top:6px">บทบาท '+ROLE_LABEL[S.me.role]+' ไม่มีความสามารถที่หน้านี้ต้องใช้ — ลองสลับเป็น ต้น (ผู้ดูแลระบบ) ที่มุมขวาบน</div></div>';
}
function render(){
  const app = document.getElementById("app");
  if(!S.me){ app.innerHTML = viewLogin(); return; }
  app.innerHTML = topbar()
   + '<div style="position:relative">'+notifPanel()+"</div>"
   + '<div class="shell">'+sidebar()+'<main class="main">'+body()+"</main></div>"
   + modalHost()
   + (S.toast? '<div class="toast"><div>'+h(S.toast.msg)+"</div>"+(S.toast.sub? '<div class="t2">'+h(S.toast.sub)+"</div>":"")+"</div>":"");
  document.title = "KSK Platform — ตัวอย่างหน้าจอ";
}
window.addEventListener("hashchange", ()=>{ S.selGate=null; S.modal=null; render(); });
render();
</script>
