services:
  # The review app (app/server.ts) — the only app in this repo. A second
  # service, ksk-console, used to sit alongside it here: the older
  # `/ksk-keying`-in-one-`claude -p`-run console on port 4820, with its own
  # mock engine and runs/ volume. It was removed once this app superseded it;
  # nothing here depends on it. Run state lives inside each client-month's own
  # ข้อมูลระบบ/_pages/run-state.yaml under the workspace mount itself, which is
  # why there is no separate runs/ volume.
  ksk-app:
    build:
      context: .
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
    # host networking: also what lets the cloudflared sidecar below reach this
    # app at localhost:8940. Note this app binds KSK_APP_HOST (0.0.0.0 by
    # default) and has no auth layer of its own — the Cloudflare Access policy
    # on the tunnel is the only thing gating it, so do not expose the host's
    # port directly to an untrusted network.
    network_mode: host
    # tini reaps anything that becomes orphaned during catastrophic failure;
    # normal cancellation is handled earlier by process-supervisor.ts.
    init: true
    # Give SIGTERM handling enough time to TERM -> grace -> KILL all active
    # stage and gate process groups before Docker forcibly tears down cgroup.
    stop_grace_period: 20s
    # Failsafes, not lifecycle control: one bad agent command cannot consume
    # unlimited host processes or more than a bounded CPU share.
    pids_limit: 512
    cpus: "${KSK_APP_CPUS:-2.0}"
    # The host this runs on is a 4-core Pi whose swap is already fully consumed
    # at idle, and the container has been OOM-killed (exit 137) in practice. An
    # unbounded container turns a runaway agent into a *host*-level OOM, which
    # takes the tunnel sidecar and everything else down with it; bounded, the
    # kernel kills only this container and the restart policy brings it back.
    mem_limit: "${KSK_APP_MEM:-3g}"
    mem_reservation: "${KSK_APP_MEM_RESERVATION:-1g}"
    environment:
      KSK_APP_PORT: "${KSK_APP_PORT:-8940}"
      KSK_APP_HOST: "${KSK_APP_HOST:-0.0.0.0}"
      KSK_APP_CONCURRENCY: "${KSK_APP_CONCURRENCY:-1}"
      KSK_WORKSPACE_ROOT: /workspace
    volumes:
      # Real client data — set KSK_APP_WORKSPACE_ROOT_HOST in .env. Required,
      # and declared with `:?` so compose says exactly that: this app always
      # shells out to a real `claude -p` per stage (see
      # sequencer/spawn-stage.ts), so there is no mock mode and no sane
      # placeholder workspace to fall back to. Failing loudly on an unset var
      # beats silently binding an empty dir and showing zero clients.
      - "${KSK_APP_WORKSPACE_ROOT_HOST:?set it in .env — the client workspace root, e.g. /home/peerasak/Dropbox/...}:/workspace"
      # The /ksk-keying skill + its subagents (watson, marple, sherlock,
      # poirot, lestrade, columbo, magnum, ...) live in the install root's own
      # .claude/, not inside the client workspace. On bare-host runs,
      # KSK_WORKSPACE_ROOT sits a few directories *below* that root, so Claude
      # Code finds .claude/ by walking up from cwd. Inside the container
      # /workspace has nothing above it, so without this mount every stage
      # instantly no-ops with "Unknown command: /ksk-keying" and gets
      # misreported as a clean done (0 events of real work, $0 cost) — set
      # KSK_APP_SKILLS_HOST in .env to the install root's .claude/ dir.
      - "${KSK_APP_SKILLS_HOST:-./.empty-skills}:/workspace/.claude:ro"
      # Claude CLI auth. Read-write, not read-only: the CLI refreshes
      # accessToken against refreshToken and writes the new pair back here, so
      # mounting rw keeps host and container logged in as the same session
      # instead of drifting apart. HOST_HOME (not $HOME) deliberately: if this
      # is ever brought up via `sudo docker compose ...`, ambient $HOME
      # resolves to /root, silently mounting the wrong (nonexistent)
      # credential path. Set HOST_HOME explicitly in .env instead of relying
      # on shell environment.
      #
      # The DIRECTORY, not `.claude/.credentials.json` alone. A single-file
      # bind resolves to an inode at `compose up` time, and Claude Code
      # refreshes credentials by writing a temp file and renaming it over the
      # target — which allocates a NEW inode. The container keeps the old,
      # now-unreferenced one forever: it can neither see the host's fresh
      # token nor successfully write its own, so it lands on
      # `expiresAt: 0` and every subsequent `claude -p` dies instantly with
      # "OAuth session expired and could not be refreshed". That surfaces as
      # a stage `env-error` seconds into a run, with nothing in the client's
      # documents to blame. It recurred twice (339/69-03 repair on 07-29,
      # 218/69-03 on 07-30, ~9h after a host token refresh) and is
      # unrecoverable without `--force-recreate`, because the container's
      # self-heal path writes into the orphaned inode too. A directory bind
      # is resolved per-lookup by path, so renames inside it are followed.
      - ${HOST_HOME}/.claude:/home/app/.claude
      # Deliberately NOT ${HOST_HOME}/.claude.json. Measured 2026-07-27: this
      # bind is read-write and the container's own `claude -p` writes to it, so
      # up to KSK_INTERPRET_CONCURRENCY leaves plus the host's interactive
      # session were rewriting one unlocked ~62 KB JSON with no coordination —
      # a torn write there breaks Claude Code startup on the HOST, taking down
      # far more than this container. (It had drifted onto a separate inode by
      # the time it was caught, which was luck, not design: every `compose up`
      # re-binds them.) The container needs this file only to skip onboarding
      # prompts (theme pick, telemetry consent, account recognition) that would
      # otherwise hang a headless `claude -p` spawn — never to share state, so
      # it gets its own gitignored copy, seeded from the host file with
      # `projects` and the refetchable caches stripped, 2 KB instead of 62 KB.
      # Real auth is .credentials.json above, which genuinely must stay shared
      # read-write for token refresh.
      - ./state/claude.json:/home/app/.claude.json

  # Exposes ksk-app at ksk-keying.peerasak.com via Cloudflare Tunnel, gated by
  # a Cloudflare Access policy (email allowlist) — see README for setup.
  # network_mode: host so it can reach ksk-app at localhost:8940 the same way
  # ksk-app itself binds there; credentials/config live in the host's
  # ~/.cloudflared (outside the repo, never committed).
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    # Tunnel credentials file on the host is owned by uid 1000 (peerasak)
    # with 0400 perms; the image's default non-root user has a different
    # uid, so it can't read the mount without this.
    user: "${UID:-1000}:${GID:-1000}"
    command: ["tunnel", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - ${HOST_HOME}/.cloudflared/ksk-keying.yml:/etc/cloudflared/config.yml:ro
      - ${HOST_HOME}/.cloudflared/a28fb812-44cd-409e-a9c4-d83da9968079.json:/home/peerasak/.cloudflared/a28fb812-44cd-409e-a9c4-d83da9968079.json:ro
